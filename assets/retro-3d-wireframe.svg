<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <!-- Phosphor Glow Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for 90s Cyber Horizon -->
    <linearGradient id="grid-fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .font-hud { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #00ff66; letter-spacing: 1.5px; }
    .font-hud-cyan { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #00f0ff; letter-spacing: 1px; }
    .font-hud-dim { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #1e4d35; }
    .wire-green { stroke: #00ff66; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-cyan { stroke: #00f0ff; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dim { stroke: #064e3b; fill: none; stroke-width: 0.8; }
    .node-pt { fill: #00ff66; }
  </style>

  <!-- Deep Terminal CRT Background -->
  <rect width="900" height="400" fill="#030712" rx="12" />
  <rect width="896" height="396" x="2" y="2" fill="none" stroke="#064e3b" stroke-width="1.5" rx="10" />
  <rect width="888" height="388" x="6" y="6" fill="none" stroke="#00ff66" stroke-width="0.75" stroke-dasharray="8 6" opacity="0.4" rx="8" />

  <!-- 90s Perspective Wireframe Ground Grid (Horizon Vanishing Point at x=450, y=260) -->
  <g opacity="0.85">
    <!-- Horizon Line -->
    <line x1="40" y1="260" x2="860" y2="260" stroke="#00f0ff" stroke-width="1" opacity="0.5" />

    <!-- Receding Perspective Depth Lines -->
    <line x1="450" y1="260" x2="50" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="150" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="250" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="350" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="450" y2="390" stroke="url(#grid-fade)" stroke-width="1.5" />
    <line x1="450" y1="260" x2="550" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="650" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="750" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />
    <line x1="450" y1="260" x2="850" y2="390" stroke="url(#grid-fade)" stroke-width="1.2" />

    <!-- Horizontal Distance Rings -->
    <line x1="390" y1="270" x2="510" y2="270" stroke="#00ff66" stroke-width="0.8" opacity="0.2" />
    <line x1="330" y1="285" x2="570" y2="285" stroke="#00ff66" stroke-width="0.9" opacity="0.3" />
    <line x1="260" y1="305" x2="640" y2="305" stroke="#00ff66" stroke-width="1.0" opacity="0.4" />
    <line x1="180" y1="332" x2="720" y2="332" stroke="#00ff66" stroke-width="1.1" opacity="0.5" />
    <line x1="90" y1="365" x2="810" y2="365" stroke="#00ff66" stroke-width="1.3" opacity="0.6" />
  </g>

  <!-- 3D CENTRAL CORE: ROTATING WIREFRAME POLYTOPE / KNOWLEDGE SPHERE -->
  <g transform="translate(450, 160)" filter="url(#glow-green)">

    <!-- Center Pulse Anchor -->
    <circle cx="0" cy="0" r="14" fill="#00ff66" opacity="0.2">
      <animate attributeName="r" values="12;18;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#00ff66" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />

    <!-- 1. Equatorial Orbiting Ring (X-Z plane rotated) -->
    <g>
      <ellipse cx="0" cy="0" rx="120" ry="42" class="wire-green" stroke-dasharray="8 4" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      
      <!-- Nodes on Ring 1 -->
      <circle cx="120" cy="0" r="4.5" class="node-pt" />
      <circle cx="-120" cy="0" r="4.5" class="node-pt" />
      <circle cx="0" cy="42" r="4" class="node-pt" />
      <circle cx="0" cy="-42" r="4" class="node-pt" />
    </g>

    <!-- 2. Oblique Orbiting Ring A (+45 deg inclined) -->
    <g transform="rotate(45)">
      <ellipse cx="0" cy="0" rx="115" ry="38" class="wire-cyan" filter="url(#glow-cyan)" />
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="14s" repeatCount="indefinite" />
      
      <!-- Satellites -->
      <circle cx="115" cy="0" r="5" fill="#00f0ff" />
      <circle cx="-115" cy="0" r="5" fill="#00f0ff" />
      <line x1="115" y1="0" x2="0" y2="0" stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
      <line x1="-115" y1="0" x2="0" y2="0" stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
    </g>

    <!-- 3. Oblique Orbiting Ring B (-45 deg inclined) -->
    <g transform="rotate(-45)">
      <ellipse cx="0" cy="0" rx="110" ry="35" class="wire-green" />
      <animateTransform attributeName="transform" type="rotate" from="-45" to="-405" dur="16s" repeatCount="indefinite" />
      
      <circle cx="0" cy="35" r="4" fill="#00ff66" />
      <circle cx="0" cy="-35" r="4" fill="#00ff66" />
    </g>

    <!-- 4. Inner Wireframe 3D Octahedron / Core Lattice -->
    <g>
      <!-- Apex Top & Bottom -->
      <polygon points="0,-75 60,-15 0,35 -60,-15" class="wire-green" stroke-width="1.4" opacity="0.85" />
      <polygon points="0,75 60,-15 0,35 -60,-15" class="wire-cyan" stroke-width="1.2" opacity="0.75" />
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-dasharray="4 2" />
      
      <animateTransform attributeName="transform" type="rotate" values="0; 12; 0; -12; 0" dur="8s" repeatCount="indefinite" />
    </g>

    <!-- 5. Floating Geometric Satellite Prisms -->
    <!-- Left Satellite: wiki/ node -->
    <g transform="translate(-180, -40)">
      <polygon points="0,-16 16,0 0,16 -16,0" class="wire-green" />
      <circle cx="0" cy="0" r="3" fill="#00ff66" />
      <line x1="16" y1="0" x2="60" y2="20" stroke="#00ff66" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
      <text x="-40" y="-22" class="font-hud-cyan">[NODE: WIKI]</text>
      <text x="-40" y="-10" class="font-hud-dim">LOD-0 MOC</text>
    </g>

    <!-- Right Satellite: self/ node -->
    <g transform="translate(180, -40)">
      <polygon points="0,-16 16,0 0,16 -16,0" class="wire-cyan" />
      <circle cx="0" cy="0" r="3" fill="#00f0ff" />
      <line x1="-16" y1="0" x2="-60" y2="20" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
      <text x="15" y="-22" class="font-hud-cyan">[NODE: SELF]</text>
      <text x="15" y="-10" class="font-hud-dim">LOD-1 LESSONS</text>
    </g>

    <!-- Bottom Satellite: Hermes / Engine node -->
    <g transform="translate(0, 115)">
      <polygon points="-24,0 0,-14 24,0 0,14" class="wire-green" />
      <circle cx="0" cy="0" r="3" fill="#00ff66" />
      <line x1="0" y1="-14" x2="0" y2="-40" stroke="#00ff66" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />
      <text x="-48" y="30" class="font-hud">[HERMES ENGINE]</text>
    </g>
  </g>

  <!-- 90s HUD OVERLAYS & TELEMETRY -->
  <!-- Top Left: SGI / System Header -->
  <g transform="translate(25, 32)">
    <rect x="0" y="0" width="280" height="48" fill="#040b17" stroke="#064e3b" stroke-width="1" rx="4" />
    <text x="12" y="18" class="font-hud">SYSTEM: SGI IRIX 6.2 // MIPS R10K</text>
    <text x="12" y="34" class="font-hud-cyan">WIREFRAME ENGINE: OPENGL 1.1 / VRML</text>
    <circle cx="265" cy="15" r="4" fill="#00ff66">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Right: Telemetry & Memory Matrix -->
  <g transform="translate(615, 32)">
    <rect x="0" y="0" width="260" height="48" fill="#040b17" stroke="#064e3b" stroke-width="1" rx="4" />
    <text x="12" y="18" class="font-hud">PROMPT CACHE: [ OPTIMAL / LOCKED ]</text>
    <text x="12" y="34" class="font-hud-cyan">SQLITE HITS: 5/6 (THRESHOLD >= 0.88)</text>
  </g>

  <!-- Bottom Left: 3D Coordinate Trackers -->
  <g transform="translate(25, 355)">
    <text x="0" y="0" class="font-hud-dim">MATRIX_COORDS:</text>
    <text x="110" y="0" class="font-hud">[ X: +044.20  Y: -112.08  Z: +089.44 ]</text>
    <text x="0" y="18" class="font-hud-dim">POLYGON_COUNT:</text>
    <text x="110" y="18" class="font-hud-cyan">1,024 VECTORS @ 60 FPS (NO LAG)</text>
  </g>

  <!-- Bottom Right: Architecture Badge -->
  <g transform="translate(620, 355)">
    <text x="0" y="0" class="font-hud-dim">BOOT_PROTOCOL:</text>
    <text x="115" y="0" class="font-hud">KARPATHY LLM-WIKI</text>
    <text x="0" y="18" class="font-hud-dim">STORAGE_SPEC:</text>
    <text x="115" y="18" class="font-hud-cyan">ZERO-DB MARKDOWN VAULT</text>
  </g>

  <!-- Crosshair targeting sights -->
  <g stroke="#00ff66" stroke-width="0.8" opacity="0.35">
    <line x1="440" y1="160" x2="460" y2="160" />
    <line x1="450" y1="150" x2="450" y2="170" />
    <circle cx="450" cy="160" r="30" fill="none" stroke-dasharray="3 3" />
  </g>

  <!-- Scanline Overlay -->
  <rect width="900" height="400" fill="url(#scanlines)" pointer-events="none" />
</svg>
